<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{#se page.reencaminha}}<!-- endereços antigos da página inicial: o formulário estava na âncora «contacto» e os cartões levavam ?tipo=; agora o
     pedido é em orcamento.html (com o mesmo ?tipo=). No topo do <head>, antes das letras, do CSS e do prefetch: um script
     depois de uma folha de estilo espera por ela, e o browser descarregava a página inicial antes de mudar. Sem
     JavaScript fica a CtaBand com essa âncora e o botão do pedido -->
<script>(function(){var l=location,m=/[?&]tipo=([^&#]*)/.exec(l.search);if(m||l.hash.slice(1)==='contacto')l.replace('orcamento.html'+(m?'?tipo='+m[1]:''));})();</script>
{{/se}}<!-- o site só tem tema claro: impede o browser do telemóvel de o escurecer sozinho -->
<meta name="color-scheme" content="only light">
<script>document.documentElement.className += ' js';</script>
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="robots" content="{{ page.robots }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.legalName }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:locale" content="pt_PT">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="{{ og_w }}">
<meta property="og:image:height" content="{{ og_h }}">
<meta property="og:image:alt" content="{{ og_alt }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#12392b">
<link rel="icon" type="image/png" sizes="32x32" href="{{ root }}assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ root }}assets/img/favicon-180.png">
<link rel="preload" href="{{ root }}assets/fonts/fraunces-latin-400-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ root }}assets/fonts/archivo-latin-variable.woff2" as="font" type="font/woff2" crossorigin>{{#se page.italico}}
<link rel="preload" href="{{ root }}assets/fonts/fraunces-latin-400-700-italic.woff2" as="font" type="font/woff2" crossorigin>{{/se}}
<link rel="stylesheet" href="{{ root }}assets/css/site.css">
{{#sem emOrcamento}}{{#se barra.mostra}}<!-- a página do pedido descarrega-se em segundo plano: «Pedir Orçamento» abre logo. O endereço é o dos botões
     da página (nas fichas de obra, com ?tipo= e ?de=); não em orcamento.html (é ela) nem em obrigado.html (não leva lá) -->
<link rel="prefetch" href="{{ pedidoHref }}">
{{/se}}{{/sem}}{{& page_css }}{{& jsonld }}</head>
<body class="grain{{#se barra.mostra}} com-barra{{/se}}" data-nav="{{ page.nav }}">
<a class="skip" href="#conteudo">Saltar para o conteúdo</a>
{{> header }}
<main id="conteudo" tabindex="-1">
{{& content }}
</main>
{{> footer }}
{{#se barra.mostra}}{{> barra-acoes }}{{/se}}
<script src="{{ root }}assets/js/site.js" defer></script>
</body>
</html>
