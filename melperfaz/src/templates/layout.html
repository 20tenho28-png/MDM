<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- o site só tem tema claro: impede o browser do telemóvel de o escurecer sozinho -->
<meta name="color-scheme" content="only light">
<script>document.documentElement.className += ' js';</script>
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="robots" content="{{ page.robots }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.legalName }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:locale" content="pt_PT">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="{{ og_w }}">
<meta property="og:image:height" content="{{ og_h }}">
<meta property="og:image:alt" content="{{ og_alt }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1b2540">
<link rel="icon" type="image/png" sizes="32x32" href="{{ root }}assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ root }}assets/img/favicon-180.png">
<link rel="preload" href="{{ root }}assets/fonts/fraunces-latin-400-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ root }}assets/fonts/archivo-latin-variable.woff2" as="font" type="font/woff2" crossorigin>{{#se page.italico}}
<link rel="preload" href="{{ root }}assets/fonts/fraunces-latin-400-700-italic.woff2" as="font" type="font/woff2" crossorigin>{{/se}}
<link rel="stylesheet" href="{{ root }}assets/css/site.css">
<!-- a página do pedido descarrega-se em segundo plano: «Pedir Orçamento» abre logo -->
<link rel="prefetch" href="{{ root }}orcamento.html">
{{& page_css }}{{& jsonld }}</head>
<body class="grain{{#se barra.mostra}} com-barra{{/se}}" data-nav="{{ page.nav }}">
<!-- os ícones do site, desenhados uma vez e usados com <use href="#i-…"> -->

<a class="skip" href="#conteudo">Saltar para o conteúdo</a>
{{> header }}
<main id="conteudo" tabindex="-1">
{{& content }}
</main>
{{> footer }}
{{#se barra.mostra}}{{> barra-acoes }}{{/se}}
<script src="{{ root }}assets/js/site.js" defer></script>
</body>
</html>
