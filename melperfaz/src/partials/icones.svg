<!-- Os ícones do site (Fase 5b do plano): desenhados uma vez aqui, numa grelha de 24 (o círculo de «enviado» em 48),
     com traço de 1,75 em currentColor, cantos vivos (sem pontas redondas, como o resto da marca). Substituem os glifos
     de texto →, ≡, ✓ e ‹ ›. Uma página usa-os com {{icone nome}} (build.py): o símbolo é copiado para o sítio, num
     <svg class="icone i-nome" aria-hidden="true">, para o CSS poder animar as partes (as barras do menu viram X, os
     vistos desenham-se); um nome que não está aqui é erro do build.
     Os traços que se desenham (visto, enviado) têm pathLength="1": o CSS anima stroke-dashoffset de 1,05 a 0.
