# Netlify: no painel do site, «Base directory» = melperfaz (este ficheiro é lido a partir daí).
# O site publicado é o que o build.py gera em public/. Formulário de pedido: Netlify Forms «orcamento», declarado em
# orcamento.html; a deteção e os avisos por email ligam-se no painel do Netlify (Forms → Form notifications).
[build]
  command = "python3 build.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

# Imagens e letras não mudam de nome nem de conteúdo. CSS e JS levam ?v=<versão> no HTML (build.py, pelo conteúdo do
# ficheiro): uma versão nova é um endereço novo, por isso também podem ficar um ano em cache.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
