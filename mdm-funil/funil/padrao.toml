# Valores por defeito do funil de pedidos MDM.
# Não alteres este ficheiro: escreve só o que muda num config.toml na pasta do projeto.

[geral]
# Data de referência para "hoje" (AAAA-MM-DD). Vazio = hoje.
data_referencia = ""
# Marca o relatório como dados de exemplo.
exemplo = false

[empresa]
# Endereços de email da MDM. Servem para distinguir o que é resposta da MDM.
emails = ["mdmassistencia@gmail.com"]
# Telefones da MDM e dos técnicos, para não serem confundidos com clientes (nos grupos de WhatsApp escrevem pela MDM).
telefones = []
# Nomes com que a MDM aparece nas conversas de WhatsApp exportadas.
nomes_whatsapp = ["MDM", "MDM Climatização", "Bernardo"]

[calendario]
hora_inicio = 9
hora_fim = 18
# Feriados municipais ou dias de fecho extra (MM-DD). 06-13 = Santo António (Lisboa).
feriados_extra = ["06-13"]
carnaval = false

[pedidos]
# Contactos do mesmo cliente separados por mais de N dias de silêncio contam como pedido novo.
dias_novo_pedido = 60
# Um orçamento sem decisão nem fatura ao fim de N dias conta como perdido.
dias_decisao = 120
# Um pedido sem orçamento nem fatura ao fim de N dias conta como perdido antes do orçamento.
dias_sem_orcamento = 30
# Uma fatura conta para um pedido se for emitida até N dias depois do orçamento ou do contacto.
dias_fatura = 180
# Depois de uma fatura ou de uma recusa, uma mensagem nova do cliente mais de N dias depois abre um pedido novo.
dias_fechado = 7
# Taxas de ganho só com pedidos com mais de N dias (o resultado já é quase sempre conhecido). Assim os ganhos,
# que se veem logo, não pesam mais do que as perdas, que só se confirmam meses depois.
dias_maturidade = 120
# Um telefone ou email que aparece com N ou mais nomes diferentes é tratado como contacto da MDM.
limite_contacto_partilhado = 8
# Telefones ou emails que o cálculo tratou como partilhados mas que são de um só cliente (ex.: "912 345 678").
nunca_partilhados = []

[email]
# Domínios a ignorar (fornecedores, bancos, serviços). `python -m funil remetentes` ajuda a encontrá-los.
dominios_ignorar = []
# Remetentes a ignorar (endereço completo).
remetentes_ignorar = []
# Endereço que envia as notificações do formulário do site (o cliente vem no Reply-To).
remetentes_formulario = []
# Domínios de email pessoal. Os outros domínios contam como empresa.
dominios_pessoais = ["gmail.com", "googlemail.com", "hotmail.com", "hotmail.pt", "outlook.com", "outlook.pt", "live.com", "live.com.pt", "msn.com", "sapo.pt", "yahoo.com", "yahoo.com.br", "icloud.com", "me.com", "mail.pt", "clix.pt", "netcabo.pt", "aeiou.pt", "iol.pt", "gmx.com", "gmx.net", "protonmail.com", "proton.me"]

[whatsapp]
# Ordem da data nas exportações: "dmy" (Portugal) ou "mdy" (Estados Unidos).
ordem_data = "dmy"
# Início das mensagens automáticas da MDM (saudação e ausência do WhatsApp Business). Não contam como resposta.
mensagens_automaticas = []
# Conversas a ignorar (técnicos, fornecedores, família): o nome ou o número como aparece no nome do ficheiro.
# As conversas com os números de [empresa] telefones e de [chamadas] ignorar também são ignoradas.
conversas_ignorar = []
# Uma mensagem da MDM igual em N ou mais conversas e enviada até S segundos depois do cliente conta como automática.
repeticoes_automaticas = 3
segundos_automaticas = 90

[chamadas]
# Números a ignorar (família, fornecedores, serviços).
ignorar = []
# Colunas dos ficheiros CSV de chamadas (registo do telemóvel ou fatura detalhada).
coluna_data = "data"
coluna_hora = "hora"
coluna_numero = "numero"
coluna_tipo = "tipo"
coluna_duracao = "duracao"
# Se o ficheiro só tem chamadas efetuadas (é normalmente o caso da fatura detalhada), escreve "saida".
direcao_fixa = ""
valores_entrada = ["recebida", "entrada", "incoming", "atendida"]
valores_saida = ["efetuada", "saida", "outgoing", "realizada", "originada"]
valores_perdida = ["perdida", "nao atendida", "missed", "rejeitada", "sem resposta"]

[orc]
# Folhas cujo nome contém este texto não entram na leitura do valor do orçamento.
folhas_custos = "custo"

[faturas]
coluna_data = "data"
coluna_numero = "numero"
coluna_cliente = "cliente"
coluna_nif = "nif"
coluna_valor = "valor"
coluna_descricao = "descricao"
coluna_telefone = "telefone"
coluna_email = "email"
# Tipo de documento: vem desta coluna ou, se não existir, das letras no início do número (ex.: "FT 2026/12").
coluna_tipo = "tipo"
# Documentos que contam como fatura e como nota de crédito. Os outros (recibos RG, pró-formas PF...) são ignorados.
tipos_fatura = ["FT", "FR", "FS"]
tipos_credito = ["NC"]
# true se o valor da coluna inclui IVA.
valor_com_iva = false
taxa_iva = 0.23

[site]
coluna_id = "id"
coluna_data = "created_at"
coluna_nome = "nome"
coluna_email = "email"
coluna_telefone = "telefone"
coluna_mensagem = "mensagem"
coluna_tipo = "tipo"
coluna_localidade = "localidade"

