[prioridade]
# Regras atuais (tabela de decisão: a primeira regra que bate decide).
# Condições possíveis: tipo, empresa, urgente, data_marcada, unidades (">=3"), canal.
regras = [
  { se = { tipo = "avaria" }, prioridade = "P1" },
  { se = { tipo = "obra" }, prioridade = "P2" },
  { se = { data_marcada = true }, prioridade = "P2" },
  { se = { unidades = ">=3" }, prioridade = "P2" },
]
padrao = "P3"
# Características usadas para dividir os pedidos em segmentos no cálculo do custo do atraso.
segmentar_por = ["tipo", "empresa"]
# Resposta rápida e resposta lenta, em horas úteis (9 horas úteis = 1 dia útil).
horas_rapida = 4
horas_lenta = 18
# Modelo do efeito da demora (regressão logística com partilha entre segmentos):
# respostas mais lentas do que limite_horas contam como limite_horas;
# desvio_nivel e desvio_inclinacao dizem quanto cada segmento se pode afastar da média (escala logit);
# simulacoes = número de simulações para os intervalos; minimo_modelo = pedidos maduros necessários.
limite_horas = 45
desvio_nivel = 1.0
desvio_inclinacao = 0.5
simulacoes = 400
minimo_modelo = 30
# Fração dos pedidos em P1 e em P1+P2 nas prioridades sugeridas (ajusta à capacidade da equipa).
quota_p1 = 0.2
quota_p1p2 = 0.5
# Segmentos com menos pedidos maduros do que isto ficam marcados como "poucos dados".
minimo_segmento = 10
# Fração mais recente dos pedidos já decididos guardada para o teste das regras.
fracao_teste = 0.3

[semanal]
# Objetivo de primeira resposta, em horas úteis.
objetivo_resposta_horas = 4
# Data em que mudaram o processo (AAAA-MM-DD). As semanas antes servem de base aos limites.
data_mudanca = ""

[prazos]
# Prazo de cada estado por P, depois de validado com o chefe. Vazio = o modo sombra propõe a partir do histórico.
# Unidades: novo em horas úteis; espera_cliente em dias de calendário (é a data de seguimento); os outros em dias
# úteis. Exemplo: novo = { P1 = 4, P2 = 9, P3 = 18 }
novo = {}
orcamento_por_fazer = {}
espera_cliente = {}
em_execucao = {}
# Com a agenda do ERP (dados/agenda/), em dias úteis:
visita_por_marcar = {}
visita_marcada = {}
espera_fornecedor = {}
# Como o modo sombra propõe os prazos:
# 1. O prazo de cada estado e P é este percentil do tempo desse P no estado (0.8 = 8 em cada 10 pedidos cumpriam).
# 2. Ao responder e ao orçamentar, conta o tempo que esse P teria tido se a mesma equipa trabalhasse pela ordem do P
#    (simulação com os mesmos momentos em que a MDM respondeu e enviou orçamentos). Nos outros estados, o tempo atual.
percentil = 0.8
# Na espera do cliente, o prazo é o primeiro seguimento: este percentil do tempo que os clientes levam a decidir
# (0.5 = quando metade já decidiu, os outros recebem um contacto).
percentil_seguimento = 0.5
# 3. Nestes P, o prazo nunca passa do momento em que esta fração dos clientes já cobrou ("então, já viram?").
limitar_pela_paciencia = ["P1", "P2"]
fracao_paciencia = 0.2
# 4. O P1 nunca tem mais tempo do que o P2, nem o P2 do que o P3.
# Mínimo de pedidos que passaram por um estado para propor um prazo.
minimo_casos = 8
# Um pedido perdido ficou vermelho "a tempo" se o aviso apareceu até N dias depois da última mensagem do cliente.
dias_a_tempo = 7
# Regra dos 30 dias: sem contacto com o cliente há N dias, o pedido sai da lista (fecha, ou ganha ação para hoje).
dias_sem_contacto = 30
