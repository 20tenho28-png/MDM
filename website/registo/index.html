<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Registo MDM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230D6788%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2214%22 fill=%22%23fff%22 text-anchor=%22middle%22%3EMDM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
/* Layout: três vistas. Triagem = resumo, filtros, lista ordenada pelo P e pelo tempo que falta, fila por estado e por dono.
   Registo = todos os pedidos, com procura. Prazos = tabela estado x P e a folha na Drive. Cada pedido abre numa folha lateral. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --sunk:#E4EAED; --ink:#13212B; --ink-2:#4C5D68; --line:#D2DBE0;
  --accent:#0D6788; --on-accent:#FFFFFF; --copper:#9C5224;
  --good:#1D7448; --warn:#9A6200; --bad:#B03535; --info:#3A5BA0; --muted:#66757F;
  --scrim:rgba(8,16,22,.45);
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E161B; --surface:#152028; --sunk:#0B1216; --ink:#E4ECF0; --ink-2:#9AAEB9; --line:#263540;
    --accent:#5DB8DD; --on-accent:#06212C; --copper:#E39A68;
    --good:#62C994; --warn:#E6B450; --bad:#F08A8A; --info:#93ABEB; --muted:#8B9CA6;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#152028; --sunk:#0B1216; --ink:#E4ECF0; --ink-2:#9AAEB9; --line:#263540;
  --accent:#5DB8DD; --on-accent:#06212C; --copper:#E39A68;
  --good:#62C994; --warn:#E6B450; --bad:#F08A8A; --info:#93ABEB; --muted:#8B9CA6;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho e separadores */
.top{padding-block:22px 0}
.top-in{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
h1{font-size:36px;font-weight:600;line-height:1.05;letter-spacing:.005em}
.next{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.next b{font-family:var(--font-mono);font-weight:500;font-size:15px;color:var(--ink)}
@media (max-width:639px){.next{align-items:flex-start;text-align:left}}
.drive-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.drive-dot.ok{background:var(--good)}.drive-dot.err{background:var(--bad)}.drive-dot.busy{background:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:9px 12px 10px;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font-family:var(--font-mono);font-size:11.5px;font-weight:500;background:var(--bad);color:var(--surface);border-radius:999px;padding:0 7px;line-height:1.65}
.badge:empty{display:none}

main.wrap{padding-block:18px 110px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:21px;font-weight:600}
.sec-h .count{font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.note{font-size:12.5px;color:var(--ink-2);margin:10px 0 0;max-width:80ch}

/* Resumo */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;border:0;cursor:pointer}
.kpi:hover{background:var(--sunk)}
.kpi .k-l{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.kpi .k-v{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.kpi.t-bad .k-v{color:var(--bad)}.kpi.t-warn .k-v{color:var(--warn)}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:20px}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}

/* Filtros */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.75}
.toolrow{display:flex;flex-wrap:wrap;gap:8px}
.toolrow > *{flex:1 1 200px;min-width:0}
.search,.selectf{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}

/* Cartões de pedido */
.card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px 12px 18px;cursor:pointer}
.card:first-child{border-top:0}
.card:hover{background:var(--sunk)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stripe,transparent)}
.s-vermelho{--stripe:var(--bad)}.s-amarelo{--stripe:var(--warn)}.s-verde{--stripe:var(--good)}
.c-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-width:0}
.c-client{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.c-id{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.c-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--ink-2);min-width:0}
.c-acao{grid-column:1/-1;font-size:13.5px;overflow-wrap:anywhere}
.c-acao b{font-weight:600}
.c-time{font-size:13px;font-weight:600;text-align:right;align-self:start;white-space:nowrap;color:var(--tone,var(--ink-2))}
.c-money{font-family:var(--font-mono);font-size:12.5px;color:var(--copper);white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;color:var(--tone);background:color-mix(in srgb,var(--tone) 14%,transparent);white-space:nowrap}
.t-good{--tone:var(--good)}.t-warn{--tone:var(--warn)}.t-bad{--tone:var(--bad)}.t-info{--tone:var(--info)}.t-muted{--tone:var(--muted)}.t-accent{--tone:var(--accent)}
.prio{font-family:var(--font-mono);font-size:11.5px;font-weight:500;border:1px solid currentColor;border-radius:4px;padding:0 5px;line-height:1.5}
.p-P1{color:var(--bad)}.p-P2{color:var(--warn)}.p-P3{color:var(--good)}
.u-P1{--u:var(--bad)}.u-P2{--u:var(--warn)}.u-P3{--u:var(--good)}
/* Mosaico */
.mos-leg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.mos-leg button{font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--u) 45%,transparent);background:color-mix(in srgb,var(--u) 10%,var(--surface));color:var(--ink);cursor:pointer;min-height:40px}
.mos-leg button::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--u)}
.mos-leg button b{font-family:var(--font-mono);font-weight:600;color:var(--u)}
.mos-leg button[aria-pressed="true"]{background:var(--u);color:var(--surface);border-color:var(--u)}
.mos-leg button[aria-pressed="true"]::before{background:var(--surface)}
.mos-leg button[aria-pressed="true"] b{color:var(--surface)}
.mos-leg .todos{--u:var(--ink-2)}
.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:0 0 18px}
.tile{font:inherit;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--u) 40%,transparent);border-left:5px solid var(--u);background:color-mix(in srgb,var(--u) 13%,var(--surface));color:var(--ink)}
.tile:hover{background:color-mix(in srgb,var(--u) 22%,var(--surface))}
.tile .tn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts.late{color:var(--bad);font-weight:600}
.esc{font-size:11.5px;font-weight:600;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:4px;padding:0 5px;line-height:1.5}
.conf{font-size:11.5px;font-weight:600;color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent);border-radius:4px;padding:0 5px;line-height:1.5}
.bola{font-size:12px;color:var(--ink-2)}
.empty{padding:20px 16px;color:var(--ink-2);margin:0}
.empty b{color:var(--ink);font-family:var(--font-mono);font-weight:500}

/* Tabelas pequenas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:13px}
td.n input{width:72px;text-align:right;font-family:var(--font-mono);font-size:15px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:5px 7px}
.over{color:var(--bad);font-weight:600}
.sub{color:var(--ink-2);font-size:12px}

/* Botões */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14.5px}
.btn:disabled{opacity:.55;cursor:default}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--sunk)}
.btn-danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn-danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn-sm{padding:6px 10px;font-size:13.5px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:13px 20px;font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.01em;cursor:pointer;box-shadow:0 6px 18px rgba(8,30,40,.28);z-index:20}

/* Folha do pedido */
.backdrop{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){.backdrop{align-items:center;padding:24px}.sheet{max-width:660px;border-radius:14px;max-height:100%}}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);z-index:2}
.sheet-h h2{font-size:22px;font-weight:600;overflow-wrap:anywhere}
.sheet-h .sub{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
.x{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.sheet-b{padding:14px 16px 18px;display:flex;flex-direction:column;gap:18px}
.block{display:flex;flex-direction:column;gap:8px}
.block h3{font-size:17px;font-weight:600}
.status{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.clock{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;background:var(--bg)}
.clock .big{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--tone,var(--ink))}
.clock .small{font-size:13px;color:var(--ink-2)}
.acao{border:1px solid var(--line);border-left:4px solid var(--stripe,var(--line));border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.acao .what{font-weight:600;overflow-wrap:anywhere}
.acao .who{font-size:13px;color:var(--ink-2)}
.trans{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.hint.alert{color:var(--warn);font-weight:500}
fieldset{border:0;margin:0;padding:0;min-width:0}
.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:480px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit;font-size:16px;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f .aux{font-size:12.5px;color:var(--ink-2)}
.f .aux:empty{display:none}
.f .aux a{color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px}
.check input{width:18px;height:18px;flex:none}
.tform{border:1px solid var(--accent);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.tform h3{font-size:18px}
.row-end{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.err{color:var(--bad);font-size:13.5px;margin:0}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.hist .when{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);padding-top:1px}
details.dados summary{cursor:pointer;font-family:var(--font-display);font-size:17px;font-weight:600}
details.dados[open] summary{margin-bottom:10px}

/* Entrada */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login-box h1{font-size:30px}
.login-box .f input{font-size:16px}
.user{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);flex-wrap:wrap;justify-content:flex-end}
.user b{color:var(--ink);font-weight:600}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);vertical-align:1px;margin-right:5px}
.live.ok{background:var(--good)}.live.err{background:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){.card,.chip,.btn,.tab,.kpi{transition:background-color .12s ease,color .12s ease}}
/* ===== Layout tipo gestor de candidaturas: barra lateral, filtros numa linha, tabela com ações rápidas ===== */
:root{--rail:#1C2B35}
body.app-on{background:var(--surface)}
.shell{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px))}
.rail button{width:48px;height:48px;border-radius:12px;border:0;background:transparent;color:#E8EEF1;display:grid;place-items:center;cursor:pointer;position:relative}
.rail button:hover{background:rgba(255,255,255,.12)}
.rail button[aria-current="page"]{background:rgba(255,255,255,.2)}
.rail .r-novo{background:#FFFFFF;color:#13212B;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rail .r-novo:hover{background:#FFFFFF}
.rail svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rail .r-fim{margin-top:auto}
.rail .r-badge{position:absolute;top:4px;right:3px;font:600 10.5px/1.6 var(--font-mono);background:var(--bad);color:#fff;border-radius:999px;padding:0 5px}
.rail .r-badge:empty{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 24px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.logo{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent);letter-spacing:-.01em;line-height:1}
.logo small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--ink-2);margin-left:8px;letter-spacing:0}
.topbar .user{gap:14px;font-size:14px}
.page{padding:22px max(16px,env(safe-area-inset-right,0px)) 110px 24px;max-width:1500px}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vista{display:inline-flex;align-items:center;gap:6px;position:relative;min-width:0;max-width:100%}
.page-h > .vista{flex:0 1 auto}
.vista select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-family:var(--font-display);font-size:32px;font-weight:600;color:var(--ink);padding:0 30px 0 0;cursor:pointer;max-width:100%;min-width:0;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}

  /* ---------- Calendário: horas úteis 9h-18h, sem feriados nacionais nem Santo António ---------- */
  const H_INI = 9, H_FIM = 18, H_DIA = 9;
  const FIXOS = ['01-01','04-25','05-01','06-10','06-13','08-15','10-05','11-01','12-01','12-08','12-25'];
  const ferCache = {};
  function pascoa(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), hh = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - hh - k) % 7, m = Math.floor((a + 11 * hh + 22 * l) / 451);

  const janela = d => [new Date(d.getFullYear(), d.getMonth(), d.getDate(), H_INI), new Date(d.getFullYear(), d.getMonth(), d.getDate(), H_FIM)];

    if (!(b > a)) return 0;
    let total = 0;

      if (isUtil(iso(d))) {
        const [ji, jf] = janela(d);
        const ini = a > ji ? a : ji, fim = b < jf ? b : jf;
        if (fim > ini) total += (fim - ini) / 3600000;
      }
      d.setDate(d.getDate() + 1);

    return total;
  }
  function somarHorasUteis(a, horas) {
    let cur = new Date(a), resta = Math.max(0, horas) * 3600000;
    for (let i = 0; i < 5000; i++) {
      const d = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate());
      if (isUtil(iso(d))) {
        const [ji, jf] = janela(d);

        if (ini < jf) { const disp = jf - ini; if (resta <= disp) return new Date(ini.getTime() + resta); resta -= disp; }
      }

  function prazoDe(estado, p) { const t = prazosAtuais()[estado]; const v = t ? Number(t[p || 'P3']) : NaN; return Number.isFinite(v) && v > 0 ? v : null; }

  /* ---------- Relógio ---------- */
  // Devolve {vence: Date, atrasoH, restaH, un, prazo} para o estado atual do pedido.
  function relogio(r, agora) {

      const vence = new Date(y, m-1, d, H_FIM);
      return {un:'data', vence, atrasoH: agora > vence ? horasUteis(vence, agora) : 0, restaH: agora < vence ? horasUteis(agora, vence) : 0};
    }

    }

  }
  function atrasadoNaMDM(r, rel) { return DA_MDM.includes(r.estado) && rel && rel.vence && rel.atrasoH > 0; }
  function semaforo(r, rel) {
    if (!ABERTOS.includes(r.estado)) return null;
    const hoje = today();
    const acaoAtrasada = r.dataProximaAcao && r.dataProximaAcao < hoje;
    const acaoHoje = r.dataProximaAcao === hoje;
    if ((rel && rel.vence && rel.atrasoH > 0) || acaoAtrasada || !r.proximaAcao) return 'vermelho';

  }
  function tempoTxt(r, rel) {

  const ultimoContacto = r => r.ultimoContacto || r.entrouNoEstado || r.criado || null;

  /* ---------- Regras de entrada do P ---------- */

  /* ---------- Numeração ---------- */

  /* ---------- Separadores ---------- */

  function stateMsg() {

  /* ---------- Triagem ---------- */

  /* ---------- Gerir pedidos: filtros numa linha e tabela com ações rápidas ---------- */

      : campo('t-motivo','Como ficou resolvido', inp('t-motivo', t.motivo || ''), null, true)));
    if (!fecho) {
      const dflt = t.soAcao ? {acao: r.proximaAcao, data: r.dataProximaAcao || today()}
        : t.seguimento ? {acao: r.estado === 'espera_fornecedor' ? 'Voltar a perguntar ao fornecedor' : 'Fazer o seguimento seguinte', data: iso(new Date(Date.now() + (prazoDe(r.estado, p) || 3) * (r.estado === 'espera_cliente' ? 86400000 : 86400000 * 7 / 5)))}
        : {acao: sugestaoAcao(para, extra), data: dataProposta(para, p, {...extra, dataVisita: null})};
      els.push(h('div',{class:'fields'},
        campo('t-dono','Dono', donoInput('t-dono', r.dono || meuNome())),
        campo('t-data','Data da próxima ação', inp('t-data', dflt.data, {type:'date'})),
        campo('t-acao','Próxima ação', inp('t-acao', dflt.acao, {placeholder:'O quê, por exemplo «Ligar a confirmar a visita»'}), null, true)));
      if (t.pedeVisita) els.push(h('p',{class:'hint'}, 'A data da próxima ação acompanha a da visita, para o pedido ficar amarelo nesse dia; muda-a se for preciso.'));
    }
    if (r.porConfirmar && !t.soAcao && !t.seguimento && !t.remarcar) els.push(h('p',{class:'hint'}, 'Ao confirmar, o pedido deixa de estar «por confirmar» e o relógio começa a contar a partir de agora.'));
    if (DA_MDM.includes(r.estado) && !t.soAcao && !t.seguimento && !t.remarcar) {
      const rel = relogio(r);
      if (atrasadoNaMDM(r, rel) && !r.escalado && !r.porConfirmar && p !== 'P1') els.push(h('p',{class:'hint alert'}, `Este estado passou o prazo: ao confirmar, o pedido sobe de ${p} para ${up(p)} (uma vez só).`));
    }

    els.push(h('div',{class:'row-end'},
      h('button',{class:'btn btn-ghost', type:'button', onclick:() => { trans = null; renderSheet(); }}, 'Voltar'),
      h('button',{class:'btn', type:'button', id:'t-ok', onclick:confirmarTrans}, 'Confirmar')));
    return h('div',{class:'tform'}, els);

  function erroT(msg) { const el = F('t-err'); el.textContent = msg; el.hidden = false; }
  const val = id => { const el = F(id); return el ? el.value.trim() : ''; };
  function parseValor(s) {
    s = String(s || '').replace(/\s|€/g,'');
    if (!s) return null;
    if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
    const v = Number(s); return Number.isFinite(v) ? Math.round(v * 100) / 100 : NaN;
  }
  const nota = (texto) => ({em: new Date().toISOString(), texto});

  async function confirmarTrans() {
    const r = cur(); if (!r || !trans || saving) return;
    const t = trans, agora = new Date(), novo = JSON.parse(JSON.stringify(r));
    delete novo.id;
    const hist = novo.historico = (novo.historico || []).slice(-60);
    const p = r.prioridade || 'P3';
    if (!t.fecho) {
      const d = val('t-dono'), a = val('t-acao'), dt = val('t-data');
      if (!d || !a || !dt) return erroT('Cada mudança precisa de dono, próxima ação e data.');
      novo.dono = d; novo.proximaAcao = a; novo.dataProximaAcao = dt;
    }
    if (t.soAcao) {
      hist.push(nota(`Próxima ação: ${novo.proximaAcao} (${novo.dono}, ${ddmm(novo.dataProximaAcao)})`));
      return gravar(r.id, novo, 'Ação atualizada');
    }
    if (t.seguimento) {
      novo.seguimentos = (r.seguimentos || 0) + 1; novo.ultimoSeguimento = agora.toISOString();
      if (r.estado === 'espera_cliente') novo.ultimoContacto = agora.toISOString();
      hist.push(nota(`${novo.seguimentos}.º seguimento (${novo.dono})`));
      return gravar(r.id, novo, `${novo.seguimentos}.º seguimento registado`);
    }
    if (t.pedeVisita) {
      const dv = val('t-vis'); if (!dv) return erroT('Indica a data da visita.');
      novo.dataVisita = dv; novo.horaVisita = val('t-vis-h') || null;
      novo.ultimoContacto = agora.toISOString();
      // Remarcar não muda de estado: nem escala nem mexe no relógio.
      if (t.remarcar) { novo.remarcacoes = (r.remarcacoes || 0) + 1; hist.push(nota(`Visita remarcada para ${ddmm(dv)}`)); return gravar(r.id, novo, 'Visita remarcada'); }
    }
    if (t.envio) {
      const n = val('t-num').toUpperCase(), m = /^ORC(\d{4})_(\d{4})$/.exec(n);
      if (!m) return erroT('O número tem de seguir o formato ORC0073_2026.');
      if (rows.some(x => x.num === n && x.id !== r.id)) return erroT(`O ${n} já está noutro pedido.`);
      const v = parseValor(val('t-valor'));
      if (v == null || Number.isNaN(v)) return erroT('Indica o valor s/IVA (por exemplo 1250,00).');
      if (!val('t-denv') || !val('t-epor')) return erroT('Indica a data de envio e quem enviou.');
      Object.assign(novo, {num:n, seq:Number(m[1]), ano:Number(m[2]), valor:v, dataEnvio:val('t-denv'), enviadoPor:val('t-epor'), enviadoPorOnde:val('t-ponde'), envioConfirmado:true, ultimoContacto: agora.toISOString()});
    }
    if (t.fecho) {
      const mo = val('t-motivo');
      if (!mo) return erroT(t.para === 'perdido' ? 'Escolhe o motivo da perda.' : 'Escreve em poucas palavras como ficou resolvido.');
      novo.motivo = mo; novo.dataFecho = today(); novo.proximaAcao = null; novo.dataProximaAcao = null;
    }
    // Escalada: o estado da MDM que se deixa passou o prazo. Sobe um nível, uma vez só.
    const rel = relogio(r, agora);
    if (DA_MDM.includes(r.estado) && atrasadoNaMDM(r, rel) && !r.escalado && !r.porConfirmar && p !== 'P1') {
      novo.prioridade = up(p); novo.escalado = true; novo.escaladoEm = today();
      hist.push(nota(`Escalado de ${p} para ${novo.prioridade}: ${ESTADOS[r.estado].l} passou o prazo`));
    }
    if (r.porConfirmar) { novo.porConfirmar = false; hist.push(nota('Dados confirmados; o relógio passa a contar')); }
    // Relógio: pausar numa espera guarda o tempo gasto; voltar ao mesmo estado continua; avançar recomeça.
    const gastoAqui = !r.porConfirmar && DA_MDM.includes(r.estado) && r.estado !== 'visita_marcada' ? (Number(r.acumuladoH) || 0) + horasUteis(new Date(r.entrouNoEstado || agora), agora) : 0;
    if (t.pausa) { novo.esperaDe = r.estado; novo.esperaMotivo = 'pausa'; novo.acumuladoPausa = gastoAqui; novo.acumuladoH = 0; }
    else if (t.decisao) { novo.esperaDe = r.estado; novo.esperaMotivo = 'decisao'; novo.acumuladoPausa = 0; novo.acumuladoH = 0; }
    else if (t.retoma) { novo.acumuladoH = Number(r.acumuladoPausa) || 0; novo.esperaDe = null; novo.esperaMotivo = null; novo.acumuladoPausa = 0; }
    else { novo.acumuladoH = 0; if (!ESPERAS.includes(t.para)) { novo.esperaDe = null; novo.esperaMotivo = null; novo.acumuladoPausa = 0; } }
    if (ESPERAS.includes(t.para)) { novo.seguimentos = 0; novo.ultimoSeguimento = null; }
    if (t.revisao) novo.revisoes = (r.revisoes || 0) + 1;
    if (t.reabrir) { novo.reaberturas = (r.reaberturas || 0) + 1; novo.motivo = null; novo.dataFecho = null; }
    if (t.ganho) novo.dataAceite = today();
    novo.estado = t.para; novo.entrouNoEstado = agora.toISOString();
    if (t.para === 'resolvido' || t.para === 'perdido') { novo.acumuladoH = 0; novo.esperaDe = null; novo.esperaMotivo = null; }
    hist.push(nota(`${ESTADOS[r.estado].l} → ${ESTADOS[t.para].l}${t.fecho && novo.motivo ? ` (${novo.motivo})` : ''}${!t.fecho ? ` · ${novo.dono}: ${novo.proximaAcao}` : ''}`));
    return gravar(r.id, novo, `Passou a ${ESTADOS[t.para].l}`);
  }

  async function registarContacto() {
    const r = cur(); if (!r) return;
    const novo = JSON.parse(JSON.stringify(r)); delete novo.id;
    novo.ultimoContacto = new Date().toISOString();
    novo.historico = (novo.historico || []).slice(-60); novo.historico.push(nota('Contacto com o cliente'));
    await gravar(r.id, novo, 'Contacto registado');
  }

  async function gravar(id, doc, msg) {
    if (!sb || saving) return false;
    saving = true; const ok = F('t-ok'); if (ok) ok.disabled = true;
    doc.atualizado = new Date().toISOString();
    doc.atualizadoPor = eu ? eu.email : null;
    const atual = rows.find(x => x.id === id);
    const versao = atual ? (atual._versao || 0) : 0;
    const ultimo = (doc.historico || []).slice(-1)[0];
    try {
      const {data, error} = await sb.rpc('guardar_pedido', {p_id: id, p_dados: doc, p_versao: versao, p_evento: ultimo ? ultimo.texto : null});
      if (error) throw error;
      // Mostra já a mudança; a leitura seguinte confirma-a.
      const i = rows.findIndex(x => x.id === id);
      const linha = {id, ...doc, _versao: Number(data) || versao + 1};
      if (i >= 0) rows[i] = linha; else rows.push(linha);
      trans = null; modo = null; sheetSujo = false;
      toast(msg);
      renderAll();
      return true;
    } catch (e) {
      const txt = String((e && e.message) || '');
      let m = 'Não foi possível guardar. Tenta outra vez.';
      if (txt.includes('conflito')) { m = 'Alguém alterou este pedido entretanto. Recarrega e repete.'; carregar(); }
      else if (txt.includes('duplicate key')) m = 'Já existe um pedido com este número.';
      else if (txt.includes('row-level security') || txt.includes('permission')) m = 'A tua conta não tem autorização para gravar.';
      else if (txt.includes('Failed to fetch') || txt.includes('NetworkError')) m = 'Sem ligação. Verifica a internet e tenta outra vez.';
      if (F('t-err')) erroT(m); else toast(m);
      return false;
    } finally { saving = false; if (ok) ok.disabled = false; }
  }

  /* ---------- Dados do pedido ---------- */
  function camposDados(r, novo) {
    const sug = sugerirP(r);
    const pastaAux = /^https?:\/\//i.test(r.pasta || '') ? h('a',{href:r.pasta, target:'_blank', rel:'noopener'}, 'Abrir ligação') : null;

      campo('d-prio','Prioridade', sel('d-prio', PRIOS.map(p => [p, PRIO_NOME[p]]), r.prioridade || sug.p), `Pelas regras: ${sug.p} (${sug.why}).`, true),
      campo('d-desc','Descrição do trabalho', h('textarea',{id:'d-desc'}, r.descricao || ''), null, true),

      novo ? null : campo('d-valor','Valor s/IVA (€)', inp('d-valor', r.valor != null ? String(r.valor).replace('.',',') : '', {inputmode:'decimal'})),
      campo('d-dped','Data do pedido', inp('d-dped', r.dataPedido || today(), {type:'date'})),

    );
  }
  function lerDados(base) {
    const v = parseValor(val('d-valor'));
    const n = val('d-num').toUpperCase(), m = /^ORC(\d{4})_(\d{4})$/.exec(n);
    if (n && !m) return {erro:'O número do orçamento tem de seguir o formato ORC0073_2026.'};
    if (Number.isNaN(v)) return {erro:'O valor não é um número. Usa por exemplo 1250,00.'};
    if (!val('d-cliente')) return {erro:'Falta o nome do cliente.'};
    const u = val('d-unid'); if (u && !/^\d+$/.test(u)) return {erro:'As unidades são um número inteiro.'};
    return Object.assign(base, {
      cliente: val('d-cliente'), contacto: val('d-contacto') || null, localidade: val('d-localidade') || null,
      tipo: val('d-tipo') || null, origem: val('d-origem') || null, unidades: u ? Number(u) : null,
      dataImposta: F('d-dimp').checked, prioridade: val('d-prio') || 'P3', descricao: val('d-desc') || null,
      dataPedido: val('d-dped') || null, pasta: val('d-pasta') || null, notas: val('d-notas') || null,
      ...(F('d-num') ? {num: n || null, seq: m ? Number(m[1]) : null, ano: m ? Number(m[2]) : null, valor: v, dataEnvio: val('d-denv') || null, porConfirmar: F('d-conf').checked} : {}),
    });
  }
  function formDados(r) {
    const d = h('details',{class:'dados', open: dadosAberto ? true : null, ontoggle: ev => { dadosAberto = ev.currentTarget.open; }}, h('summary',null,'Dados do pedido'),
      h('fieldset',{id:'fsDados', disabled: !canWrite}, camposDados(r, false)),
      h('p',{class:'err', id:'d-err', hidden:true}),
      canWrite ? h('div',{class:'row-end', style:'margin-top:12px'},
        h('button',{class:'btn btn-danger', type:'button', id:'btnDel', onclick:apagar}, 'Apagar'),
        h('button',{class:'btn', type:'button', onclick:guardarDados}, 'Guardar dados')) : null);
    return d;
  }
  async function guardarDados() {
    const r = cur(); if (!r) return;
    const base = JSON.parse(JSON.stringify(r)); delete base.id;
    const doc = lerDados(base);
    if (doc.erro) { const el = F('d-err'); el.textContent = doc.erro; el.hidden = false; return; }
    if (doc.num && rows.some(x => x.num === doc.num && x.id !== r.id)) { const el = F('d-err'); el.textContent = `O ${doc.num} já está noutro pedido.`; el.hidden = false; return; }
    doc.historico = (doc.historico || []).slice(-60);
    if (doc.prioridade !== r.prioridade) doc.historico.push(nota(`P corrigido de ${r.prioridade || '–'} para ${doc.prioridade}`));
    if (r.porConfirmar && doc.porConfirmar === false) doc.historico.push(nota('Dados confirmados; o relógio passa a contar'));
    await gravar(r.id, doc, 'Dados guardados');
  }
  function disarmDel() { clearTimeout(delArmed); delArmed = null; const b = F('btnDel'); if (b) { b.classList.remove('armed'); b.textContent = 'Apagar'; } }
  async function apagar() {
    const r = cur(); if (!r || !sb) return;

      rows = rows.filter(x => x.id !== r.id); closeSheet(); toast(`${r.id} apagado`);

  async function criar(id) {

  async function carregar() {
    if (!sb) return;
    try {
      const [p, c, q] = await Promise.all([
        sb.from('pedidos').select('id,dados,versao').order('id'),
        sb.from('config').select('chave,valor,versao'),
        sb.from('colaboradores').select('email,nome').order('nome'),
      ]);
      if (p.error) throw p.error;
      rows = p.data.map(r => ({id: r.id, ...r.dados, _versao: r.versao}));
      if (!c.error) for (const x of c.data) { if (x.chave === 'prazos') { cfgPrazos = x.valor; cfgPrazosVersao = x.versao; } }
      if (!q.error) { equipa = q.data; const m = equipa.find(x => x.email === (eu && eu.email)); if (m && m.nome) eu.nome = m.nome; }
      status = 'ok'; renderAll();
    } catch (e) {
      const txt = String((e && e.message) || '');
      if (status !== 'ok') { status = 'error'; renderAll(); }
      if (txt.includes('Failed to fetch')) toast('Sem ligação. A mostrar a última leitura.');
    }
  }

  let canal = null, recarga = null;
  function ligarTempoReal() {
    if (!sb || canal) return;
    canal = sb.channel('registo-mdm')
      .on('postgres_changes', {event:'*', schema:'public', table:'pedidos'}, () => { clearTimeout(recarga); recarga = setTimeout(carregar, 250); })
      .on('postgres_changes', {event:'*', schema:'public', table:'config'}, () => { clearTimeout(recarga); recarga = setTimeout(carregar, 250); })
      .subscribe(st => { ligado = st === 'SUBSCRIBED'; const d = F('liveDot'); d.className = 'live ' + (ligado ? 'ok' : st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' ? 'err' : ''); d.title = ligado ? 'Atualizações em tempo real ligadas' : 'Sem tempo real; a página recarrega de minuto a minuto'; });
  }
  async function entrar(session) {
    sessao = session; eu = {email: session.user.email, nome: null};
    // Só quem está na tabela colaboradores pode ler e escrever.
    const {data, error} = await sb.from('colaboradores').select('email,nome').eq('email', eu.email).maybeSingle();
    if (error || !data) {
      await sb.auth.signOut();
      F_LOGIN(); erroLogin(error && !String(error.message).includes('permission') ? 'Não foi possível verificar a conta. Tenta outra vez.' : 'Esta conta ainda não tem acesso ao registo. Pede ao Bernardo para juntar o teu email aos colaboradores.');
      return;
    }
    eu.nome = data.nome || eu.email.split('@')[0];
    canWrite = true;
    F('userTxt').textContent = eu.nome;
    F_APP(); status = 'loading'; renderAll();
    await carregar();
    ligarTempoReal();
  }
  function sair() {
    if (canal) { sb.removeChannel(canal); canal = null; }
    sessao = null; eu = null; rows = []; canWrite = false; status = 'loading'; ligado = false;
    F_LOGIN(); erroLogin('');
  }
  F('loginForm').addEventListener('submit', async ev => {
    ev.preventDefault(); erroLogin('');
    const email = F('l-email').value.trim(), password = F('l-pass').value;
    F('l-ok').disabled = true;
    try {
      const {data, error} = await sb.auth.signInWithPassword({email, password});
      if (error) throw error;
      await entrar(data.session);
    } catch (e) {
      const txt = String((e && e.message) || '');
      erroLogin(txt.includes('Invalid login') ? 'Email ou palavra-passe errados.' : txt.includes('Failed to fetch') ? 'Sem ligação. Verifica a internet.' : 'Não foi possível entrar. Tenta outra vez.');
    } finally { F('l-ok').disabled = false; }
  });
  F('btnSair').addEventListener('click', async () => { await sb.auth.signOut(); sair(); });

  (async () => {
    if (!window.supabase || !window.supabase.createClient) { F_LOGIN(); erroLogin('Não foi possível carregar a biblioteca da base de dados. Recarrega a página.'); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const {data} = await sb.auth.getSession();
    if (data && data.session) await entrar(data.session); else F_LOGIN();
    sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT' && sessao) sair(); });
    // Sem tempo real (rede a bloquear websockets), recarrega de minuto a minuto; com ele, confirma a cada 5 minutos.
    setInterval(() => { if (sessao && status === 'ok' && !trans && modo !== 'novo' && !sheetSujo) carregar(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && sessao) carregar(); });
  })();
})();
</script>
</body>
</html>
