# Netlify: base directory = website
[build]
  command = "python3 build.py --check"
  publish = "public"

# Imagens e letras não mudam de nome nem de conteúdo; CSS e JS mudam sem mudar de nome, por isso cache curta.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# cartão de contacto da página das carrinhas: abre a ficha "adicionar contacto" no telemóvel
[[headers]]
  for = "/mdm.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
