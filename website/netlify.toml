# Netlify: base directory = website
# Pré-visualização: o noindex (X-Robots-Tag) vem de public/_headers, escrito por publica.py enquanto
# data/site.json tiver "preview": true. No lançamento muda-se só esse valor (README.md, "Visual novo").
# Formulários de pedido: Netlify Forms «orcamento» e «orcamento-comercial», declarados em site/formularios.html;
# a deteção e os avisos por email ligam-se no painel do Netlify (Forms).
# O site publicado é o visual novo (site/, HTML estático): publica.py copia-o para public/ com a página da equipa e
# confere os formulários e as ligações. O site antigo (build.py) fica no repositório para a página da equipa e a skill.
[build]
  command = "python3 publica.py"
  publish = "public"

# Imagens e letras não mudam de nome nem de conteúdo. CSS e JS levam ?v=<versão> no HTML (build.py, pelo conteúdo do
# ficheiro): uma versão nova é um endereço novo, por isso também podem ficar um ano em cache.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Assistente de propostas da equipa (equipa/, uso interno): fora dos motores de busca e sem cache (o CSS e o JS de
# equipa/ não levam ?v=, por isso o browser tem de confirmar sempre se mudaram).
[[headers]]
  for = "/equipa/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Registo de pedidos da equipa (registo/, uso interno, com entrada por palavra-passe): fora dos motores de busca e sem
# cache, pela mesma razão que /equipa/*.
[[headers]]
  for = "/registo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
