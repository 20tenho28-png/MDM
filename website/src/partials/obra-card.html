<article class="obra-card" data-cat="{{ obra.cat }}">
  <a class="obra-link" href="{{ root }}obras/{{ obra.slug }}.html" aria-describedby="obra-meta-{{ obra.n }}">
    <span class="obra-quadro">{{foto {{ obra.n }} sizes="(min-width: 1100px) 300px, (min-width: 700px) 45vw, 100vw"}}</span>
    <span class="obra-cab"><span class="obra-t">{{ obra.title }}</span><span class="obra-code">{{ obra.code }}</span></span>
  </a>
  <p class="registo" id="obra-meta-{{ obra.n }}">{{ obra.especialidade }} · {{ obra.trabalho }} · {{ obra.equipamento }} · {{ obra.local }}</p>
</article>
