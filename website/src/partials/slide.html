<figure class="slide" role="group" aria-roledescription="diapositivo" aria-label="{{ pos }} de {{ total }}" data-slide>
  <a class="slide-link" href="{{ root }}obras/{{ obra.slug }}.html">
    <span class="slide-quadro">{{foto {{ obra.n }} sizes="(min-width: 1100px) 600px, 85vw"}}</span>
  </a>
  <figcaption class="slide-leg">
    <span class="slide-cab"><a class="slide-t" href="{{ root }}obras/{{ obra.slug }}.html">{{ obra.title }}</a><span class="obra-code">{{ obra.code }}</span></span>
    <span class="registo">{{ obra.especialidade }} · {{ obra.trabalho }} · {{ obra.equipamento }}</span>
  </figcaption>
</figure>
